# One service, down from two. The old setup needed a shared `static` volume to
# hand the built frontend to the backend; that volume is gone with it.
services:
  today:
    container_name: today
    restart: always

    build:
      context: .

    ports:
      - "7000:7000"

    volumes:
      # SQLite database. Survives rebuilds.
      - ./data:/app/data

    environment:
      DATABASE_PATH: /app/data/today.db

# No `develop.watch` here. The image runs a production standalone build, so
# syncing source into it would achieve nothing. Use `make dev` for development.
