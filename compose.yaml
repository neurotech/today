services:
  today:
    container_name: today
    restart: always

    build:
      context: .

    # `${PORT:-7000}` is substituted by Compose from the shell or `.env` (note:
    # `.env`, not `.env.local`, which only Next reads). The container and
    # `make dev` run on the same machine now, so the port has to be movable
    # without editing four files: whichever of the two starts second needs a
    # different one.
    ports:
      - "${PORT:-7000}:${PORT:-7000}"

    volumes:
      # SQLite database. Survives rebuilds.
      - ./data:/app/data

    environment:
      DATABASE_PATH: /app/data/today.db
      # Both halves of the mapping above use this, so the server has to bind to
      # it too, not to the Dockerfile's default.
      PORT: ${PORT:-7000}

    # `restart: always` only reacts to the process exiting. A wedged Node
    # process keeps the port open and reports healthy forever, so ask it a
    # question instead. node:24-slim ships neither curl nor wget, and node has
    # had a global fetch for years, so use that rather than installing one.
    healthcheck:
      # Double-quoted, with single quotes inside the JS, so the scalar cannot be
      # misread as YAML. Exec form, so there is no shell to quote for either.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:${PORT:-7000}/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

# No `develop.watch` here. The image runs a production standalone build, so
# syncing source into it would achieve nothing. Use `make dev` for development.
